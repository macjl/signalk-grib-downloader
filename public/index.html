<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GRIB Downloader — SignalK</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: system-ui, -apple-system, sans-serif; background: #1a2535; color: #e8edf4; }
    #layout { display: grid; grid-template-columns: minmax(470px, 620px) 1fr; height: 100%; }
    @media (max-width: 900px) { #layout { grid-template-columns: 1fr; grid-template-rows: auto 50vh; } }

    #side { overflow-y: auto; padding: 16px; }
    #map  { height: 100%; min-height: 300px; }

    h1 { font-size: 17px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: #9fb0c5; margin: 18px 0 8px; }

    .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .alert { display: none; border-color: #8a3038; background: rgba(138,48,56,0.18); color: #ffc2c8; font-size: 12px; line-height: 1.35; }
    .alert b { color: #fff; }

    label { font-size: 12px; color: #9fb0c5; }
    input, select {
      background: #25344a; color: #e8edf4; border: 1px solid #3a4d68; border-radius: 6px;
      padding: 5px 8px; font-size: 13px; width: 100%;
    }
    input[type="checkbox"] { width: auto; }
    input:focus, select:focus { outline: none; border-color: #4d9fff; }

    button {
      background: #2563b0; color: #fff; border: none; border-radius: 7px;
      padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #2e75cc; }
    button:disabled { background: #3a4d68; cursor: default; }
    button.secondary { background: #31425c; }
    button.secondary:hover { background: #3d5273; }
    button.danger { background: #8a3038; }
    button.small { padding: 4px 9px; font-size: 12px; }

    .mode-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .schedule-note { margin-top: 6px; font-size: 11px; color: #9fb0c5; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-size: 11px; color: #9fb0c5; padding: 4px 6px; font-weight: 600; }
    td { padding: 4px 6px; vertical-align: middle; }
    tr.src-row { border-top: 1px solid rgba(255,255,255,0.07); }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .badge.ok    { background: #1d4d2b; color: #7fe39a; }
    .badge.stale { background: #4d3a1d; color: #e3c47f; }
    .badge.run   { background: #1d3a4d; color: #7fc4e3; }
    .badge.err   { background: #4d1d22; color: #e37f8a; }
    .badge.off   { background: #31425c; color: #9fb0c5; }
    .badge.wait  { background: #243a52; color: #8fb8d8; }
    .badge.metered { background: #4d3a1d; color: #e3c47f; }
    .badge.offline { background: #4d1d22; color: #e37f8a; }
    .badge.captive { background: #4d2d1d; color: #e3a07f; }

    .src-status, .remote-plan { font-size: 11px; color: #9fb0c5; margin-top: 2px; }
    .remote-plan { padding-left: 24px; }
    .log { font-family: ui-monospace, monospace; font-size: 11px; background: #131c29; border-radius: 6px;
           padding: 8px; margin-top: 6px; white-space: pre-wrap; max-height: 130px; overflow-y: auto; color: #b8c6d9; }

    #bbox-inputs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
    #save-bar { position: sticky; bottom: 0; background: #1a2535; padding: 10px 0 2px; display: flex; gap: 8px; align-items: center; }
    #save-note { font-size: 12px; color: #9fb0c5; }
    #save-note.dirty { color: #e3c47f; font-weight: 600; }
    .row-actions { display: flex; gap: 4px; }

    .src-card { border-top: 1px solid rgba(255,255,255,0.07); padding: 8px 0 6px; }
    .src-main { display: flex; align-items: center; gap: 8px; }
    .src-main select { width: auto; }
    .auto-toggle { display: inline-flex; align-items: center; gap: 4px; color: #e8edf4; font-weight: 700; white-space: nowrap; }
    .src-sub { display: flex; align-items: center; gap: 10px; margin-top: 7px; padding-left: 24px; }
    .src-sub input[type="range"] { flex: 1; accent-color: #4d9fff; padding: 0; }
    .hours-label { font-size: 12px; color: #e8edf4; white-space: nowrap; min-width: 110px; }
    .hours-label .max { color: #9fb0c5; }
    .hours-label.at-max { color: #7fe39a; font-weight: 600; }
    .vol { font-size: 12px; color: #e3c47f; white-space: nowrap; min-width: 70px; text-align: right; }
    #total-vol { font-size: 12px; color: #9fb0c5; margin-top: 8px; text-align: right; }
    #total-vol b { color: #e3c47f; }

    <h1>⚓ <span data-i18n="title">GRIB Downloader</span></h1>
    <div id="login-banner" class="card" style="display:none; border-color:#e3c47f; color:#e3c47f;"></div>
    <div id="runtime-banner" class="card alert"></div>
    <div id="legacy-export-warning" class="card" role="status" style="display:none; border-color:#e3c47f; color:#e3c47f;"></div>

    <div class="card">
      <div class="mode-row">
        <span style="font-size:12px;color:#9fb0c5" data-i18n="autoHint"></span>
        <span style="flex:1"></span>
        <span id="net-badge"></span>
        <button id="btn-download-all"></button>
      </div>
      <div id="auto-interval" class="schedule-note"></div>
    </div>

    <h2 data-i18n="sources">Sources</h2>
    <div class="card">
      <div id="src-list"></div>
      <div style="margin-top:8px; display:flex; align-items:center;">
        <button class="secondary small" id="btn-add" data-i18n="addSource">+ Ajouter une source</button>
        <div id="total-vol" style="flex:1; margin-top:0"></div>
      </div>
    </div>

    <h2 data-i18n="zone">Zone de téléchargement (GFS)</h2>
    <div class="card">
      <div style="font-size:12px;color:#9fb0c5" data-i18n="zoneHint">
        Glissez les coins du rectangle sur la carte — appliqué aux modèles avec découpe serveur (GFS).

      </div>
      <div id="bbox-inputs">

        <div><label data-i18n="west">Ouest</label><input id="bb-lonmin" type="number" step="0.5"></div>
        <div><label data-i18n="east">Est</label><input id="bb-lonmax" type="number" step="0.5"></div>

    </div>

    <div id="save-bar">

      <span id="save-note"></span>
    </div>
  </div>
  <div id="map"></div>

// ── Constants ────────────────────────────────────────────────────────────────
const API = '/plugins/signalk-grib-downloader'
const DIRECT_PROVIDERS = {
  noaa: 'NOAA (NOMADS)',
  meteofrance: 'Météo-France',
  dwd: 'DWD',
}
const MODELS = {
  gfs:        { provider: 'noaa', label: 'GFS', resolutions: ['0p25', '0p50', '1p00'], maxHours: 384, sliderStep: 3 },
  'gfs-wave': { provider: 'noaa', label: 'GFS-Wave', resolutions: ['0p25'], maxHours: 384, sliderStep: 3 },
  arome:      { provider: 'meteofrance', label: 'AROME', resolutions: ['0025', '001'], maxHours: 51, sliderStep: 1 },
  arpege:     { provider: 'meteofrance', label: 'ARPÈGE', resolutions: ['01', '025'], maxHours: 102, sliderStep: 1 },
  'icon-eu':  { provider: 'dwd', label: 'ICON-EU', resolutions: [], maxHours: 120, sliderStep: 3 },
}

// Volume estimation (MB) — constants measured on real downloads.
// GFS is bbox-subsetted server-side: size ∝ grid points × steps.
function estimateMB(s) {
  if (s.remoteServer) return NaN
  const hours = s.hours ?? MODELS[s.model].maxHours
  // No measured wave compression estimate yet; do not show zero or reuse
  // atmospheric sizing. Any total including waves is also unknown.
  if (s.model === 'gfs-wave') return NaN
  if (s.model === 'gfs') {
    const deg = { '0p25': 0.25, '0p50': 0.5, '1p00': 1 }[s.resolution || '0p25'] || 0.25
    const b = config.bbox || { latMin: 35, lonMin: -6, latMax: 45, lonMax: 17 }
    const pts = (Math.abs(b.latMax - b.latMin) / deg + 1) * (Math.abs(b.lonMax - b.lonMin) / deg + 1)
    // ≈21 B per grid point per step: 12 messages per step since the 850 mb
    // level joined the fetch (was 8 → 15 B), later steps carry a few extra
    // accumulation-bucket messages.
    return pts * 21 * (Math.floor(hours / 3) + 1) / 1048576
  }
  if (s.model === 'icon-eu') return (Math.floor(hours / 3) + 1) * 13.8
  if (s.model === 'arome')   return hours * (s.resolution === '001' ? 53 : 8.6)
  if (s.model === 'arpege')  return hours * (s.resolution === '025' ? 10.6 : 6.2)
  return 0
}

function fmtVol(mb) {
  if (mb >= 1024) return (mb / 1024).toFixed(1) + ' GB'
  if (mb >= 1)    return Math.round(mb) + ' MB'
  return Math.max(1, Math.round(mb * 1024)) + ' kB'
}

function fmtEstimate(mb) {
  return Number.isFinite(mb) ? '≈ ' + fmtVol(mb) : t.volumeUnknown
}

// ── State ────────────────────────────────────────────────────────────────────
let config = { bbox: { latMin: 35, lonMin: -6, latMax: 45, lonMax: 17 }, sources: [] }
const modelCatalogues = new Map()
const remotePreviews = new Map()
const sourceNames = new WeakMap()
let statusBySource = {}
let schedulerError = null
let internetState = 'unknown'
let legacyExportEnabled = false
let nextAutoTickAt = null
let expanded = new Set()
let pendingDataDeletions = new Set()
let dirty = false

function markDirty() { dirty = true; renderSaveBar() }
function renderSaveBar() {
  const note = document.getElementById('save-note')
  note.textContent = dirty ? t.dirty : ''
  note.className = dirty ? 'dirty' : ''
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
}

function renderRuntimeBanner() {
  const banner = document.getElementById('runtime-banner')
  if (!schedulerError) {
    banner.style.display = 'none'
    banner.innerHTML = ''
    return
  }
  banner.innerHTML = `<b>${t.runtimeErrorTitle}</b><br>${escapeHtml(schedulerError)}`
  banner.style.display = 'block'
}

function renderLegacyExportWarning() {
  const banner = document.getElementById('legacy-export-warning')
  banner.textContent = legacyExportEnabled ? t.legacyStorageWarning : ''
  banner.style.display = legacyExportEnabled ? 'block' : 'none'
}

// ── Map with editable bbox ───────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true }).setView([40, 5], 5)
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap', maxZoom: 12,
}).addTo(map)

let rect = null, swMarker = null, neMarker = null
const cornerIcon = L.divIcon({
  html: '<div style="width:14px;height:14px;border-radius:50%;background:#4d9fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)"></div>',
  className: '', iconSize: [14, 14], iconAnchor: [7, 7],
})

function bboxFromInputs() {
  return {
    latMin: parseFloat(document.getElementById('bb-latmin').value),
    lonMin: parseFloat(document.getElementById('bb-lonmin').value),
    latMax: parseFloat(document.getElementById('bb-latmax').value),
    lonMax: parseFloat(document.getElementById('bb-lonmax').value),
  }
}
function bboxToInputs(b) {
  document.getElementById('bb-latmin').value = b.latMin
  document.getElementById('bb-lonmin').value = b.lonMin
  document.getElementById('bb-latmax').value = b.latMax
  document.getElementById('bb-lonmax').value = b.lonMax
}

function refreshRect(fit) {
  const b = config.bbox
  const bounds = [[b.latMin, b.lonMin], [b.latMax, b.lonMax]]
  if (!rect) {
    rect = L.rectangle(bounds, { color: '#4d9fff', weight: 2, fillOpacity: 0.08 }).addTo(map)
    swMarker = L.marker([b.latMin, b.lonMin], { icon: cornerIcon, draggable: true }).addTo(map)
    neMarker = L.marker([b.latMax, b.lonMax], { icon: cornerIcon, draggable: true }).addTo(map)
    const onDrag = () => {
      const sw = swMarker.getLatLng(), ne = neMarker.getLatLng()
      config.bbox = {
        latMin: Math.round(Math.min(sw.lat, ne.lat) * 2) / 2,
        latMax: Math.round(Math.max(sw.lat, ne.lat) * 2) / 2,
        lonMin: Math.round(Math.min(sw.lng, ne.lng) * 2) / 2,
        lonMax: Math.round(Math.max(sw.lng, ne.lng) * 2) / 2,
      }
      rect.setBounds([[config.bbox.latMin, config.bbox.lonMin], [config.bbox.latMax, config.bbox.lonMax]])
      bboxToInputs(config.bbox)
      renderSources()  // GFS volume estimation depends on the bbox
      markDirty()
    }
    swMarker.on('drag', onDrag); neMarker.on('drag', onDrag)
  } else {
    rect.setBounds(bounds)
    swMarker.setLatLng([b.latMin, b.lonMin])
    neMarker.setLatLng([b.latMax, b.lonMax])
  }
  bboxToInputs(b)
  if (fit) map.fitBounds(bounds, { padding: [40, 40] })
}

;['bb-latmin', 'bb-lonmin', 'bb-latmax', 'bb-lonmax'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => {
    const b = bboxFromInputs()
    if ([b.latMin, b.lonMin, b.latMax, b.lonMax].some(isNaN)) return
    config.bbox = b
    refreshRect(false)
    renderSources()
    markDirty()
  })
})

// ── Sources table ────────────────────────────────────────────────────────────
// Directory name derived from model+resolution — the contract with the provider.
function dirName(s) {
  if (s.remoteServer) return sourceNames.get(s) ?? ''
  const res = s.resolution || MODELS[s.model]?.resolutions[0]
  return res ? `${s.model}-${res}` : s.model
}

function selectDirectModel(s, modelId) {
  const model = MODELS[modelId]
  if (s.model !== modelId) s.hours = model.maxHours
  s.model = modelId
  s.resolution = model.resolutions[0]
}

function sourceStateBadge(s) {
  const st = statusBySource[dirName(s)]
  if (!st) return ''
  if (st.running) return `<span class="badge run">${t.stRunning}</span>`
  if (st.lastError) return `<span class="badge err" title="${st.lastError.replace(/"/g, '&quot;')}">${t.stError}</span>`
  if (st.legacyExport?.lastError) return `<span class="badge err" title="${escapeHtml(st.legacyExport.lastError)}">${t.stExportError}</span>`
  if (st.legacyExport?.state === 'exporting') return `<span class="badge run">${t.stExporting}</span>`
  if (st.catalogue && st.legacyExport?.state === 'pending') return `<span class="badge wait">${t.stExportPending}</span>`
  if (st.publicationPending) return `<span class="badge wait">${t.stPublishing}</span>`
  if (s.autoDownload === false) return `<span class="badge off">${t.stManual}</span>`
  if (st.configStale) return `<span class="badge stale">${t.stConfigChanged}</span>`
  if (st.publicationLate) return `<span class="badge stale">${t.stLate}</span>`
  if (!st.lastRun) return `<span class="badge stale">${t.stNoData}</span>`
  if (st.pendingRun) {
    return `<span class="badge wait">${t.stWaiting}</span>`
  }
  if (st.upToDate) return `<span class="badge ok">${t.stUpToDate}</span>`
  return `<span class="badge stale">${t.stStale}</span>`
}

function sourceStatusLine(s) {
  const st = statusBySource[dirName(s)]
  if (schedulerError && s.autoDownload !== false) return schedulerError
  if (!st) return ''
  let line = st.lastRun ? `${t.lastRun}: ${st.lastRun}` : t.stNoData
  if (st.publicationLate) line += ` — ${t.expected}: ${st.expectedRun}`
  else if (st.pendingRun) line += ` — ${t.expected}: ${st.pendingRun}`
  if (st.catalogue) line += ` · <a href="${st.catalogue.href}" target="_blank" rel="noopener">${t.stPublished}</a>`
  return line
}

async function readRemoteModels(id, refresh = false) {
  if (!id || modelCatalogues.get(id)?.loading || (!refresh && modelCatalogues.has(id))) return
  remotePreviews.delete(id)
  modelCatalogues.set(id, { loading: true })
  renderSources()
  try {
    const response = await fetch(`${API}/remote-models/${encodeURIComponent(id)}`, { cache: 'no-store' })
    const body = await response.json()
    if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`)
    modelCatalogues.set(id, { models: body.models })
  } catch (error) {
    modelCatalogues.set(id, { error: error.message })
  }
  renderSources()
}

function remotePreview(server, model, resolution) {
  if (!remotePreviews.has(server)) remotePreviews.set(server, new Map())
  const previews = remotePreviews.get(server)
  const query = new URLSearchParams({ model })
  if (resolution) query.set('resolution', resolution)
  const key = query.toString()
  if (!previews.has(key)) {
    const state = { loading: true }
    previews.set(key, state)
    fetch(`${API}/remote-preview/${encodeURIComponent(server)}?${key}`, { cache: 'no-store' })
      .then(async response => {
        const body = await response.json()
        if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`)
        state.dataset = body
      })
      .catch(error => { state.error = error.message })
      .finally(() => {
        state.loading = false
        if (remotePreviews.get(server) === previews) renderSources()
      })
  }
  return previews.get(key)
}

function remoteDownloadLabel(catalogue, model, preview, hours) {
  if (catalogue?.error) return t.remoteFailed
  if (!catalogue || catalogue.loading || preview?.loading) return t.remoteChecking
  if (!model) return catalogue.models?.length ? t.chooseRemoteModel : t.remoteNoDataset
  if (preview?.error) return t.remoteCheckFailed
  const dataset = preview?.dataset
  if (!dataset) return t.remoteNoDataset
  if (hours !== undefined && dataset.horizon) return dataset.area ? t.remoteAreaTime : t.remoteTime
  if (dataset.area) return dataset.horizon ? t.remoteArea : t.remoteAreaNoTime
  if (dataset.horizon) return t.remoteFullTime
  return dataset.reason === 'write-required' ? t.remoteFullAccess : t.remoteFull
}

function renderSources() {
  const list = document.getElementById('src-list')
  list.innerHTML = ''
  let totalMB = 0
  config.sources.forEach((s, idx) => {
    const name = dirName(s)
    const model = MODELS[s.model] || MODELS.gfs
    const remoteServers = new Set([...(config.remoteServerIds ?? []), ...(s.remoteServer ? [s.remoteServer] : [])])
    const catalogue = modelCatalogues.get(s.remoteServer)
    const advertised = catalogue?.models ?? []
    const remoteModel = s.remoteModel ?? (sourceNames.has(s) ? s.model.toUpperCase() : '')
    const available = advertised.find(entry => entry.model === remoteModel)
    const resOpts = s.remoteServer
      ? [...new Set([...(available?.resolutions ?? []), ...(s.resolution ? [s.resolution] : [])])]
      : model.resolutions
    const prompt = catalogue?.loading ? t.remoteLoading
      : catalogue?.error ? t.remoteFailed
      : advertised.length ? t.chooseRemoteModel : t.remoteEmpty

    const preview = s.remoteServer && available ? remotePreview(s.remoteServer, remoteModel, s.resolution) : undefined
    const horizon = s.remoteServer ? preview?.dataset?.horizon
      : { minHours: model.sliderStep, maxHours: model.maxHours, stepHours: model.sliderStep }
    const configuredHours = s.remoteServer ? s.remoteHours : s.hours
    const areaSubset = preview?.dataset?.area
    const timeSubset = preview?.dataset?.horizon && configuredHours !== undefined
    const expectedSubset = areaSubset ? (timeSubset ? 'both' : 'area') : (timeSubset ? 'time' : '')
    const hours = horizon?.maxHours !== undefined ? horizon.minHours + Math.floor(
      (Math.max(horizon.minHours, Math.min(horizon.maxHours, configuredHours ?? horizon.maxHours)) - horizon.minHours) /
      horizon.stepHours) * horizon.stepHours : undefined
    const showHours = horizon?.maxHours !== undefined && horizon.minHours < horizon.maxHours
    const showOpenHours = horizon && !showHours && horizon.maxHours === undefined
    const mb = estimateMB(s)
    totalMB += mb

    const card = document.createElement('div')
    card.className = 'src-card'
    card.dataset.name = name
    card.innerHTML = `
      <div class="src-main">
        <label class="auto-toggle" title="${t.autoHint}">
          <input type="checkbox" ${s.autoDownload !== false ? 'checked' : ''} data-f="autoDownload">
          <span>${t.auto}</span>
        </label>
        <select data-f="origin" aria-label="${t.upstreamOrigin}">
          ${Object.entries(DIRECT_PROVIDERS).map(([id, label]) => `<option value="direct:${id}" ${!s.remoteServer && id === model.provider ? 'selected' : ''}>${label}</option>`).join('')}
          ${[...remoteServers].map(id => `<option value="signalk:${escapeHtml(id)}" ${id === s.remoteServer ? 'selected' : ''}>${escapeHtml(id)}</option>`).join('')}
        </select>
        ${s.remoteServer ? `<select data-f="remoteModel" aria-label="${t.chooseRemoteModel}" ${catalogue?.loading ? 'disabled' : ''}>
          ${!remoteModel ? `<option value="" selected disabled>${prompt}</option>` : ''}
          ${remoteModel && !available ? `<option selected disabled value="${escapeHtml(remoteModel)}">${escapeHtml(remoteModel)} · ${t.remoteMissing}</option>` : ''}
          ${advertised.map(entry => `<option value="${escapeHtml(entry.model)}" ${entry.model === remoteModel ? 'selected' : ''}>${escapeHtml(entry.model)}</option>`).join('')}
        </select>
        <button type="button" class="small secondary" data-act="refresh-models" title="${escapeHtml(catalogue?.error || t.refreshModels)}" aria-label="${t.refreshModels}">↻</button>`
          : `<select data-f="model" aria-label="${t.thModel}">
          ${Object.entries(MODELS).filter(([, entry]) => entry.provider === model.provider).map(([id, entry]) => `<option value="${id}" ${id === s.model ? 'selected' : ''}>${entry.label}</option>`).join('')}
        </select>`}
        <select data-f="resolution" ${resOpts.length === 0 ? 'disabled' : ''}>
          ${s.remoteServer && resOpts.length ? `<option value="" ${!s.resolution ? 'selected' : ''}>${t.anyResolution}</option>` : ''}
          ${resOpts.map(r => `<option ${r === s.resolution ? 'selected' : ''}>${escapeHtml(r)}</option>`).join('')}
        </select>
        <code style="font-size:12px;color:#9fb0c5">${escapeHtml(name || (s.remoteServer ? s.remoteServer : ''))}</code>
        <span style="flex:1"></span>
        <span class="badge-slot">${sourceStateBadge(s)}</span>
        <span class="row-actions">
          <button class="small" data-act="dl" title="${t.download}" ${s.remoteServer && (!name || !preview?.dataset) ? 'disabled' : ''}>⬇</button>
          <button class="small secondary" data-act="more">${expanded.has(name) ? '▾' : '▸'}</button>
          <button class="small danger" data-act="del">✕</button>
        </span>
      </div>
      <div class="src-sub">
        ${showHours ? `<input type="range" data-f="hours" aria-label="${t.forecastHours}" min="${horizon.minHours}" max="${horizon.maxHours}"
               step="${horizon.stepHours}" value="${hours}">
        <span class="hours-label ${hours >= horizon.maxHours ? 'at-max' : ''}">
          <b data-r="hval">${hours}</b> h <span class="max">/ ${t.maxLbl} ${horizon.maxHours} h</span>
        </span>` : ''}
        ${showOpenHours ? `<label class="hours-label">${t.forecastHours}
          <input type="number" data-f="remoteHours" aria-label="${t.forecastHours}" min="0" step="1"
                 placeholder="${t.remoteAllHours}" value="${Number.isSafeInteger(configuredHours) ? configuredHours : ''}"
                 style="width:80px;display:inline-block"> h
        </label>` : ''}
        ${s.remoteServer ? '' : `<span class="vol" data-r="vol">${fmtEstimate(mb)}</span>`}
        <span style="font-size:12px;color:#9fb0c5;white-space:nowrap" title="${t.archivesTitle}">
          ${t.archivesLbl}
          <input type="number" data-f="archiveRuns" min="0" step="1" value="${s.archiveRuns ?? 0}"
                 style="width:52px;display:inline-block">
        </span>
        <span style="font-size:12px;color:#9fb0c5;white-space:nowrap" title="${t.retentionTitle}">
          <input type="number" data-f="retentionDays" min="0" max="365" step="1" value="${Number(s.retentionDays) || 0}"
                 aria-label="${t.retentionTitle}" style="width:52px;display:inline-block">
          ${t.retentionLbl}
        </span>
      </div>
      ${s.remoteServer ? `<div class="remote-plan" role="status" title="${escapeHtml(preview?.error || '')}">
        ${remoteDownloadLabel(catalogue, remoteModel, preview, configuredHours)}
      </div>` : ''}
      <div class="src-status" style="padding-left:24px">${sourceStatusLine(s)}</div>
      <div class="src-details"></div>`

    card.querySelectorAll('[data-f]').forEach(el => {
      const f = el.dataset.f
      if (f === 'remoteHours') {
        el.addEventListener('change', () => {
          if (!el.reportValidity()) return
          if (el.value === '') delete s.remoteHours
          else if (Number.isSafeInteger(el.valueAsNumber)) s.remoteHours = el.valueAsNumber
          else return
          renderSources()
          markDirty()
        })
        return
      }
      if (f === 'hours') {
        // live label/volume update while sliding; commit on release
        el.addEventListener('input', () => {
          const h = parseInt(el.value, 10)
          const lbl = card.querySelector('[data-r="hval"]')
          lbl.textContent = h
          lbl.parentElement.classList.toggle('at-max', h >= horizon.maxHours)
          if (!s.remoteServer)
            card.querySelector('[data-r="vol"]').textContent = fmtEstimate(estimateMB({ ...s, hours: h }))
        })
        el.addEventListener('change', () => {
          const h = Number(el.value)
          if (!s.remoteServer) s.hours = h
          else if (h < horizon.maxHours) s.remoteHours = h
          else delete s.remoteHours
          renderSources()
          markDirty()
        })
        return
      }
      el.addEventListener('change', () => {
        if (f === 'autoDownload') s.autoDownload = el.checked
        else if (f === 'origin') {
          sourceNames.delete(s)
          delete s.remoteModel
          delete s.remoteHours
          const [kind, id] = el.value.split(':', 2)
          if (kind === 'signalk') {
            s.remoteServer = id
            delete s.resolution
            void readRemoteModels(id, true)
          } else {
            delete s.remoteServer
            const modelId = MODELS[s.model]?.provider === id ? s.model : Object.keys(MODELS).find(key => MODELS[key].provider === id)
            selectDirectModel(s, modelId)
          }
        }
        else if (f === 'model') selectDirectModel(s, el.value)
        else if (f === 'remoteModel') {
          s.remoteModel = el.value
          delete s.remoteHours
          delete s.resolution
          sourceNames.delete(s)
        }
        else if (f === 'resolution' && s.remoteServer) {
          if (!s.remoteModel && sourceNames.has(s)) s.remoteModel = s.model.toUpperCase()
          s.resolution = el.value || undefined
          sourceNames.delete(s)
        }
        else if (f === 'retentionDays') s.retentionDays = Math.min(365, Math.max(0, parseInt(el.value, 10) || 0))
        else if (f === 'archiveRuns') s.archiveRuns = Math.max(0, parseInt(el.value, 10) || 0)
        else s[f] = el.value
        renderSources()
        markDirty()
      })
    })
    card.querySelector('[data-act="refresh-models"]')?.addEventListener('click', () => readRemoteModels(s.remoteServer, true))
    card.querySelector('[data-act="dl"]').addEventListener('click', () => triggerDownload(name, Boolean(s.remoteServer), expectedSubset))
    card.querySelector('[data-act="more"]').addEventListener('click', (e) => {
      expanded.has(name) ? expanded.delete(name) : expanded.add(name)
      e.target.textContent = expanded.has(name) ? '▾' : '▸'
      fillDetails(card, name)
    })
    card.querySelector('[data-act="del"]').addEventListener('click', () => {
      if (!confirm(t.confirmDelete)) return
      if (name && confirm(t.confirmDeleteData(name))) pendingDataDeletions.add(name)
      config.sources.splice(idx, 1)
      renderSources()
      markDirty()
    })
    fillDetails(card, name)
    list.appendChild(card)
  })
  document.getElementById('total-vol').innerHTML =
    `${t.totalVol} <b>${fmtEstimate(totalMB)}</b> ${t.perRun}`
}

document.getElementById('btn-add').addEventListener('click', () => {
  config.sources.push({ model: 'gfs', resolution: '0p25', hours: 384, autoDownload: true })
  renderSources()
  markDirty()
})

// ── Schedule ─────────────────────────────────────────────────────────────────
function renderSchedule() {
  const interval = config.checkIntervalMinutes ?? 5
  let text = t.autoInterval(interval)
  if (nextAutoTickAt) text += t.nextCheck(new Date(nextAutoTickAt).toLocaleTimeString())
  document.getElementById('auto-interval').textContent = text
}

function renderNetBadge() {
  const el = document.getElementById('net-badge')
  if (internetState === 'metered') el.innerHTML = `<span class="badge metered">${t.netMetered}</span>`
  else if (internetState === 'captive') el.innerHTML = `<span class="badge captive">${t.netCaptive}</span>`
  else if (internetState === 'offline') el.innerHTML = `<span class="badge offline">${t.netOffline}</span>`
  else el.innerHTML = ''
}

// ── Actions ──────────────────────────────────────────────────────────────────
document.getElementById('btn-download-all').textContent = t.downloadAll
document.getElementById('btn-download-all').addEventListener('click', () => triggerDownload())

async function triggerDownload(name, remote = false, expectedSubset = '') {
  if (dirty && (remote || (!name && config.sources.some(s => s.remoteServer)))) {
    window.alert(t.remoteSaveFirst)
    return
  }
  // Manual downloads are never blocked server-side — but warn before
  // spending metered bandwidth or attempting doomed offline/captive
  // downloads.
  if (internetState === 'metered' && !confirm(t.confirmMetered)) return
  if ((internetState === 'offline' || internetState === 'captive') &&
      !confirm(internetState === 'offline' ? t.confirmOffline : t.confirmCaptive)) return
  try {
    const query = expectedSubset ? '?subset=' + expectedSubset : ''
    await fetch(`${API}/download${name ? '/' + encodeURIComponent(name) : ''}${query}`, { method: 'POST' })
    setTimeout(pollStatus, 800)
  } catch (e) { console.error(e) }
}

document.getElementById('btn-save').addEventListener('click', async () => {
  const note = document.getElementById('save-note')
  try {
    if (config.sources.some(s => s.remoteServer && !s.remoteModel && !sourceNames.has(s)))
      throw new Error(t.chooseRemoteModel)
    const r = await fetch(`${API}/settings`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(config),
    })
    if (!r.ok) {
      const body = await r.json().catch(() => ({}))
      throw new Error(body.error || `HTTP ${r.status}`)
    }
    const saved = await r.json()
    config.sources.forEach((s, index) => {
      if (saved.sourceNames?.[index]) sourceNames.set(s, saved.sourceNames[index])
    })
    for (const name of pendingDataDeletions) {
      const deletion = await fetch(`${API}/source-data/${encodeURIComponent(name)}`, { method: 'DELETE' })
      if (!deletion.ok) throw new Error((await deletion.json()).error || `HTTP ${deletion.status}`)
      pendingDataDeletions.delete(name)
    }
    pendingDataDeletions.clear()
    dirty = false
    renderSaveBar()
    renderSources()
    note.textContent = t.saved
    setTimeout(() => { if (!dirty) note.textContent = '' }, 3000)
  } catch (e) {
    note.textContent = t.saveError + e.message
    note.className = 'dirty'
  }
})

// ── Polling ──────────────────────────────────────────────────────────────────
function fillDetails(card, name) {
  const slot = card.querySelector('.src-details')
  if (!slot) return
  const st = statusBySource[name]
  if (!st || (!st.running && !expanded.has(name))) { slot.innerHTML = ''; return }
  const when = st.lastFinishedAt
    ? `${t.lastAttempt} : ${new Date(st.lastFinishedAt).toLocaleString()}`
    : (st.running ? '' : t.noAttempt)
  const err = st.lastError
    ? `<div style="color:#e37f8a;font-size:12px;margin-top:4px">⚠ ${escapeHtml(st.lastError)}</div>` : ''
  const exportInfo = st.legacyExport
    ? `<div style="font-size:12px;margin-top:4px">${t.legacyExport}: ${escapeHtml(st.legacyExport.directory)}${st.legacyExport.lastError ? `<br>⚠ ${escapeHtml(st.legacyExport.lastError)}` : ''}</div>` : ''
  const logHtml = st.lastLog?.length
    ? `<div class="log">${st.lastLog.map(l => l.replace(/</g, '&lt;')).join('\n')}</div>`
    : ''
  slot.innerHTML = `<div style="font-size:11px;color:#9fb0c5;padding-left:24px;margin-top:4px">${t.logTitle} — ${when}</div>${err}${exportInfo}${logHtml}`
}

// Refresh only the dynamic parts of each card — badges, status line,
// details. Never rebuilds inputs, so a slider drag or focused field
// survives the polling cycle.
function updateStatusUI() {
  renderRuntimeBanner()
  renderLegacyExportWarning()
  const list = document.getElementById('src-list')
  for (const s of config.sources) {
    const name = dirName(s)
    const card = list.querySelector(`.src-card[data-name="${name}"]`)
    if (!card) continue
    const badgeSlot = card.querySelector('.badge-slot')
    if (badgeSlot) badgeSlot.innerHTML = sourceStateBadge(s)
    const statusLine = card.querySelector('.src-status')
    if (statusLine) statusLine.textContent = sourceStatusLine(s)
    fillDetails(card, name)
  }
}

async function pollStatus() {
  try {
    const r = await fetch(`${API}/status`, { cache: 'no-store' })
    if (!r.ok) {
      const body = await r.json().catch(() => ({}))
      schedulerError = body.error || `HTTP ${r.status}`
      renderRuntimeBanner()
      return
    }
    const data = await r.json()
    legacyExportEnabled = data.legacyExportEnabled === true
    schedulerError = data.schedulerError || null
    if (data.catalogueAccess?.state === 'pending') schedulerError = t.cataloguePending
    else if (data.catalogueAccess?.state === 'denied') schedulerError = t.catalogueDenied
    else if (data.catalogueAccess?.state === 'error') schedulerError = data.catalogueAccess.message
    if (data.checkIntervalMinutes) config.checkIntervalMinutes = data.checkIntervalMinutes
    internetState = data.internetState || 'unknown'
    nextAutoTickAt = data.nextAutoTickAt || null
    renderNetBadge()
    renderSchedule()
    statusBySource = {}
    for (const s of data.sources) statusBySource[s.name] = s
    updateStatusUI()
  } catch { /* server unreachable — keep last state */ }
}

async function loadConfig() {
  const r = await fetch(`${API}/settings`)
  if (r.status === 401 || r.status === 403) {
    const banner = document.getElementById('login-banner')
    banner.innerHTML = t.loginRequired
    banner.style.display = 'block'
  } else if (r.ok) {
    const c = await r.json()
    config = Object.assign({ checkIntervalMinutes: 5, sources: [] }, c)
    config.sources = (config.sources ?? []).map(s => ({
      ...s,
      autoDownload: s.autoDownload ?? (s.enabled !== false),
    }))
    config.sources.forEach((s, index) => {
      if (c.sourceNames?.[index]) sourceNames.set(s, c.sourceNames[index])
      if (s.remoteServer) void readRemoteModels(s.remoteServer)
    })
    config.bbox = c.bbox ?? { latMin: 35, lonMin: -6, latMax: 45, lonMax: 17 }
  }
  renderSchedule()
  renderSources()
  refreshRect(true)
}

loadConfig().then(pollStatus)
setInterval(pollStatus, 5000)
</script>
